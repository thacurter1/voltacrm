name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci && cd ..

      - name: Build Server
        run: npm --prefix server run build

      - name: Build Frontend
        run: npm run build

      - name: Run Test Suite
        run: node run_all_tests.cjs
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: ci-test-secret-with-adequate-length-32char
          ADMIN_INITIAL_PASSWORD: ci_admin_test_1234
          ADMIN_2FA_SECRET: ci_2fa_secret_test_20char_min
